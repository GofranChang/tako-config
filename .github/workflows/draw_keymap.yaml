name: Draw ZMK keymaps

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draw-keymap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-keymap.txt
      - name: Install keymap-drawer
        run: python -m pip install -r scripts/requirements-keymap.txt
      - name: Draw keymap and update README
        run: python scripts/draw_keymap.py
      - name: Commit updated keymap
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add readme.md keymap-drawer/tako.yaml keymap-drawer/tako.svg keymap-drawer/tako-base.svg
          if git diff --cached --quiet; then
            echo "Keymap is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update Tako keymap [skip ci]"
          git push origin "HEAD:$BRANCH"
