CONFIG_ZMK_BLE=y

# DISPLAY
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# CONFIG_ZMK_EXT_POWER=n

CONFIG_ZMK_POINTING=y

# IDLE. Slowing down matrix scan rate to save power.
CONFIG_ZMK_IDLE_TIMEOUT=5000

# The EC scanner suspends in deep sleep, and Tako has no wake-up sensor.
# Keep scanning at the slow rate instead, so keys can wake the keyboard.
CONFIG_ZMK_SLEEP=n

# CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Enable during calibration.
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y
# CONFIG_SERIAL=y
# CONFIG_CONSOLE=y
# CONFIG_UART_CONSOLE=y
# CONFIG_USB_DEVICE_STACK=y
# CONFIG_USB_CDC_ACM=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y

# Pete Johanson EC module: Tako drain pin needs input/output emulation.
CONFIG_ZMK_KSCAN_EC_MATRIX_FAKE_OPEN_DRAIN=y
CONFIG_ZMK_KSCAN_EC_MATRIX_DYNAMIC_POLL_RATE=y
# Tako does not have the ADXL362 wake-up device.
CONFIG_SLEEP_AWAKE_TRIGGER=n

# USB shell for per-half calibration (enable_ec_calibrator snippet).
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_ZMK_KSCAN_EC_MATRIX_SETTINGS=y
CONFIG_ZMK_KSCAN_EC_MATRIX_VERBOSE_CALIBRATOR=y
