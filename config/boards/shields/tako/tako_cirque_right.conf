# Cirque replaces the right display; retain EC calibration and sleep settings.
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_PINNACLE2=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_INPUT_SPLIT=y
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=n
CONFIG_NICE_VIEW_WIDGET_STATUS=n
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=n

CONFIG_INPUT_THREAD_STACK_SIZE=4096

# Sweep-Pro pointing transport/memory settings (9bf146c).
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# TX8 reduced waiting in the right-side Cirque motion comparison.
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_CONN_TX_MAX=8
