# Experimental direct-to-dongle ESB split link. Same group parameters on all three.
CONFIG_ZMK_BLE=n
CONFIG_BT=n
CONFIG_SETTINGS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_COUNT=2
CONFIG_ZMK_SPLIT_ESB_ADDRESS=0x54414b4f
CONFIG_ZMK_SPLIT_ESB_CHANNEL=76
CONFIG_ZMK_SPLIT_ESB_TX_POWER=0
CONFIG_ZMK_SPLIT_ESB_HEARTBEAT_MS=200
CONFIG_ZMK_SPLIT_ESB_LINK_TIMEOUT_MS=2000
# Public DEVELOPMENT key, not a secret. Override with a private group key for real use.
CONFIG_ZMK_SPLIT_ESB_KEY="54414b4f2d4553422d4445562d4b4559"
