# Dongle is the only central; both halves retain their USB calibration shell.
---
include:
  - board: nice_nano_v2
    shield: tako_left nice_view
    snippet: zmk-analog-matrix-calibrator
    artifact-name: tako_left
  - board: nice_nano_v2
    shield: tako_right nice_view
    snippet: zmk-analog-matrix-calibrator
    artifact-name: tako_right
  - board: nice_nano_v2
    shield: tako_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: tako_dongle
  - board: nice_nano_v2
    shield: settings_reset
