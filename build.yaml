# ZMK v0.3, with per-half EC calibration over USB.
---
include:
  - board: nice_nano_v2
    shield: tako_left nice_view_elemental
    snippet: studio-rpc-usb-uart enable_ec_calibrator
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: tako_right nice_view_elemental
    snippet: enable_ec_calibrator
  - board: nice_nano_v2
    shield: settings_reset
