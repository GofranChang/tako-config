# Six artifacts: reset, experimental 2.4G dongle trio, and BLE left-central/right-peripheral pair.
---
include:
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
  - board: nice_nano_v2
    shield: tako_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DEXTRA_CONF_FILE=${GITHUB_WORKSPACE}/config/tako_2g4.conf
    artifact-name: tako_dongle
  - board: nice_nano_v2
    shield: tako_left nice_view
    snippet: zmk-analog-matrix-calibrator
    cmake-args: -DEXTRA_CONF_FILE=${GITHUB_WORKSPACE}/config/tako_2g4.conf -DCONFIG_ZMK_SPLIT_ESB_SLOT=0
    artifact-name: tako_left_dongle
  - board: nice_nano_v2
    shield: tako_right nice_view
    snippet: zmk-analog-matrix-calibrator
    cmake-args: -DEXTRA_CONF_FILE=${GITHUB_WORKSPACE}/config/tako_2g4.conf -DCONFIG_ZMK_SPLIT_ESB_SLOT=1
    artifact-name: tako_right_dongle
  - board: nice_nano_v2
    shield: tako_left nice_view
    snippet: studio-rpc-usb-uart zmk-analog-matrix-calibrator
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: tako_left_central
  - board: nice_nano_v2
    shield: tako_right nice_view
    snippet: zmk-analog-matrix-calibrator
    artifact-name: tako_right_peripheral
